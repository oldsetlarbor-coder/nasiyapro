<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>NasiyaPro — Qarz boshqaruvi</title><link rel="stylesheet" href="./css/style.css"></head>
<body><div id="toast" class="toast"></div>
<div id="authView" class="auth-wrap"><div class="auth-card"><div class="brand"><span class="brand-mark">N</span><span>Nasiya<span>Pro</span></span></div><p class="muted">Do‘koningiz uchun aqlli qarz boshqaruvi</p>
<div class="tabs"><button class="tab active" data-tab="login">Kirish</button><button class="tab" data-tab="register">Ro‘yxatdan o‘tish</button></div>
<form id="loginForm" class="form"><label>Email<input name="email" type="email" required placeholder="name@example.com"></label><label>Parol<input name="password" type="password" required placeholder="Parolingiz"></label><button class="btn primary full">Kirish</button></form>
<form id="registerForm" class="form hidden"><label>Do‘kon nomi<input name="shopName" required placeholder="Masalan, Baraka market"></label><label>Egasi ismi<input name="ownerName" required></label><label>Telefon<input name="phone" placeholder="+998..."></label><label>Email<input name="email" type="email" required></label><label>Parol<input name="password" type="password" minlength="8" required></label><button class="btn primary full">7 kun bepul boshlash</button><small class="muted">Ro‘yxatdan o‘tish bilan foydalanish shartlariga rozilik bildirasiz.</small></form></div></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="brand"><span class="brand-mark">N</span><span>Nasiya<span>Pro</span></span></div><div id="shopLabel" class="shop-label">Do‘kon</div><nav id="shopNav"><button class="nav active" data-page="dashboard">▦ <span>Bosh sahifa</span></button><button class="nav" data-page="customers">♙ <span>Mijozlar</span></button><button class="nav" data-page="debts">▤ <span>Qarzlar</span></button><button class="nav" data-page="subscription">◇ <span>Obuna</span></button></nav><button id="logoutBtn" class="nav logout">↪ <span>Chiqish</span></button></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">NASIYAPRO / <span id="pageTitle">Bosh sahifa</span></div><h1 id="welcomeTitle">Xush kelibsiz</h1></div><div class="top-actions"><span id="planBadge" class="pill">Sinov</span><button class="avatar" id="userAvatar">N</button></div></header><section id="content" class="content"></section></main></div>
<script src="/js/app.js"></script></body></html>
